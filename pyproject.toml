[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained decoding for LLM function calling"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "accelerate>=1.14.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=9.1.1",
]
